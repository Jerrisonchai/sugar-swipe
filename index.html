<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0a2e">
<title>Sugar Swipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css?v=11">
<link rel="stylesheet" href="css/animations.css?v=11">
<link rel="stylesheet" href="css/candy-designs.css?v=11">
</head>
<body>

<div id="app">

  <!-- ===== WORLD MAP SCREEN ===== -->
  <div id="world-map" class="screen active">
    <div class="map-header">
      <h1 class="map-title">🍬 Sugar Swipe</h1>
      <p class="map-sub"> ❤️ <span id="map-lives">5</span> &nbsp;|&nbsp; 🪙 <span id="map-coins">0</span> &nbsp;|&nbsp; 💰 <span id="map-goldbars">0</span></p>
      <button id="btn-open-shop" class="btn--shop-entry">🛒 Shop</button>
    </div>
    <div id="world-list" class="world-list"></div>
  </div>

  <!-- ===== LEVEL GRID SCREEN ===== -->
  <div id="level-grid" class="screen">
    <div class="grid-header">
      <h2 id="grid-world-name" class="grid-title">Candy Meadow</h2>
      <p id="grid-quote" class="grid-quote"></p>
      <div id="grid-stars-summary" class="grid-stars-summary"></div>
    </div>
    <div id="level-list" class="level-list"></div>
    <div class="back-btn-wrapper">
      <button id="btn-back-worlds" class="btn--back" aria-label="Back to worlds">
        <svg viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== ADMIN DEBUG TOGGLE ===== -->
  <button id="btn-admin" class="btn--admin" title="Admin Mode">⚙</button>

  <!-- ===== GAME SCREEN ===== -->
  <div id="game-screen" class="screen active">
    <div id="hud" class="hud-bar">
      <div class="hud-item">
        <span class="hud-label">Level</span>
        <span id="hud-level" class="hud-value">1</span>
      </div>
      <div class="hud-item hud-score">
        <span class="hud-label">Score</span>
        <span id="hud-score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Target</span>
        <span id="hud-target" class="hud-value">1000</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Lives</span>
        <span id="hud-lives" class="hud-value">❤️❤️❤️</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Moves</span>
        <span id="hud-moves" class="hud-value">25</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Jelly</span>
        <span id="hud-jelly" class="hud-value" style="display:none">🍮</span>
      </div>
    </div>

    <div id="board-wrapper">
      <div id="board-container">
        <div id="board"></div>
        <canvas id="particles"></canvas>
        <div id="combo-popup"></div>
      </div>
    </div>

    <div class="booster-tray">
      <button id="booster-moves" class="btn--booster" title="+3 Moves">
        <span class="booster-icon">+3</span>
        <span class="booster-label">Moves</span>
        <span class="booster-count" id="count-moves">0</span>
      </button>
      <button id="booster-hammer" class="btn--booster" title="Lollipop Hammer">
        <span class="booster-icon">🍭</span>
        <span class="booster-label">Hammer</span>
        <span class="booster-count" id="count-hammer">0</span>
      </button>
      <button id="booster-bomb" class="btn--booster" title="Color Bomb">
        <span class="booster-icon">💣</span>
        <span class="booster-label">Bomb</span>
        <span class="booster-count" id="count-bomb">0</span>
      </button>
      <button id="btn-pause" class="btn--booster" title="Pause">
        <span class="booster-icon">⏸</span>
        <span class="booster-label">Pause</span>
      </button>
    </div>
  </div>

  <!-- ===== OUT OF LIVES SCREEN ===== -->
  <div id="no-lives" class="screen overlay">
    <div class="glass-panel result-panel">
      <div class="lives-empty-icon">💔</div>
      <h2 class="result-title">Out of Lives!</h2>
      <p id="lives-timer" class="result-sub">Next life in 20:00</p>
      <div class="result-buttons">
        <button id="btn-refill-lives" class="btn btn--primary">Refill (100 🪙)</button>
        <button id="btn-wait-lives" class="btn btn--secondary">Back to Map</button>
      </div>
    </div>
  </div>

  <!-- ===== OUT OF LIVES SCREEN ===== -->
  <div id="level-complete" class="screen overlay">
    <div class="glass-panel result-panel">
      <h2 class="result-title">Level Complete!</h2>
      <div id="stars-container" class="stars-row">
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
      </div>
      <div id="result-score" class="result-score">Score: 0</div>
      <div class="result-buttons">
        <button id="btn-next-level" class="btn btn--primary">Next Level</button>
        <button id="btn-replay-win" class="btn btn--secondary">Replay</button>
        <button id="btn-map-win" class="btn btn--secondary">World Map</button>
      </div>
    </div>
  </div>

  <!-- ===== LEVEL FAIL SCREEN ===== -->
  <div id="level-fail" class="screen overlay">
    <div class="glass-panel result-panel">
      <h2 class="result-title">Out of Moves!</h2>
      <p class="result-sub">You were so close!</p>
      <div id="fail-score" class="result-score">Score: 0</div>
      <div class="result-buttons">
        <button id="btn-retry" class="btn btn--primary">Try Again</button>
        <button id="btn-extra-moves" class="btn btn--secondary">+5 Moves (10 🪙)</button>
        <button id="btn-map-fail" class="btn btn--secondary">World Map</button>
      </div>
    </div>
  </div>

  <!-- ===== PAUSE OVERLAY ===== -->
  <div id="pause-screen" class="screen overlay">
    <div class="glass-panel pause-panel">
      <h2 class="result-title">Paused</h2>
      <div class="result-buttons">
        <button id="btn-resume" class="btn btn--primary">Resume</button>
        <button id="btn-restart" class="btn btn--secondary">Restart</button>
        <button id="btn-quit" class="btn btn--secondary">Quit</button>
      </div>
    </div>
  </div>

  <!-- ===== SHOP SCREEN ===== -->
  <div id="shop-screen" class="screen">
    <div class="shop-header">
      <div class="shop-balance">
        <div class="bal-item">💰 <span id="shop-goldbars">0</span></div>
        <div class="bal-item">🪙 <span id="shop-coins">0</span></div>
      </div>
      <h1 class="shop-title">Sweet Shop</h1>
    </div>
    <div class="shop-tabs">
      <button class="shop-tab active" data-tab="gold">💰 Gold</button>
      <button class="shop-tab" data-tab="coins">🪙 Coins</button>
      <button class="shop-tab" data-tab="boosters">🎒 Boosters</button>
      <button class="shop-tab" data-tab="bundles">🎁 Bundles</button>
      <button class="shop-tab" data-tab="inventory">📦 Inventory</button>
    </div>
    <div class="shop-content" id="shop-content"></div>
    <div class="back-btn-wrapper">
      <button id="btn-back-shop" class="btn--back" aria-label="Back">
        <svg viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== PURCHASE CONFIRMATION ===== -->
  <div id="purchase-modal" class="screen overlay">
    <div class="glass-panel purchase-panel">
      <div id="purchase-icon" class="purchase-icon">💰</div>
      <h2 id="purchase-title" class="result-title">Confirm Purchase</h2>
      <p id="purchase-desc" class="result-sub"></p>
      <div class="result-buttons">
        <button id="btn-confirm-buy" class="btn btn--primary">Buy Now</button>
        <button id="btn-cancel-buy" class="btn btn--secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ===== PURCHASE SUCCESS ===== -->
  <div id="purchase-success" class="screen overlay">
    <div class="glass-panel purchase-panel">
      <div class="success-check">✅</div>
      <h2 class="result-title">Purchased!</h2>
      <p id="success-desc" class="result-sub"></p>
      <div class="result-buttons">
        <button id="btn-ok-success" class="btn btn--primary">Sweet!</button>
      </div>
    </div>
  </div>

</div>

<script src="js/storage.js?v=11"></script>
<script src="js/scoring.js?v=11"></script>
<script src="js/levels.js?v=11"></script>
<script src="js/board.js?v=11"></script>
<script src="js/match-engine.js?v=11"></script>
<script src="js/special.js?v=11"></script>
<script src="js/obstacles.js?v=11"></script>
<script src="js/audio.js?v=11"></script>
<script src="js/cascade.js?v=11"></script>
<script src="js/input.js?v=11"></script>
<script src="js/ui.js?v=11"></script>
<script src="js/shop.js?v=11"></script>
<script src="js/main.js?v=11"></script>
</body>
</html>
